<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Tech CMS - Erro no Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container text-center">
    <div class="card shadow-sm p-5 bg-white rounded-3 mx-auto" style="max-width: 500px;">
        <h1 class="display-4 text-danger fw-bold">Ops!</h1>
        <h3 class="mb-3">Algo deu errado.</h3>
        <p class="text-muted mb-4" th:text="${errorDescription != null ? errorDescription : 'Não foi possível se comunicar com o servidor no momento. Tente novamente mais tarde.'}">
            Mensagem de erro padrão.
        </p>
        <div>
            <a th:href="@{/}" class="btn btn-primary px-4">Voltar para o Início</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
